# 古いイメージを定期的に削除し、registry の PVC を空ける
# リポジトリごとに作成日時の新しいタグを KEEP 個残し、それより古いタグを消してから GC する
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-cleaner

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-cleaner
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["registry-backend"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-cleaner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-cleaner
subjects:
  - kind: ServiceAccount
    name: registry-cleaner

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-cleanup-script
data:
  prune-tags.sh: |
    set -eu

    REGISTRY=registry-backend-service.docker-registry.svc.cluster.local:5000
    KEEP=5

    regctl registry set "$REGISTRY" --tls disabled

    # 同じ中身のビルドはイメージの作成日時が並ぶため、push 日時（タグの link の更新日時）で新しい順に並べる
    pushed=$(kubectl exec deployment/registry-backend -- sh -c '
      cd /var/lib/registry/docker/registry/v2/repositories
      for repo in *; do
        (cd "$repo/_manifests/tags" && ls -t */current/link | cut -d/ -f1 | sed "s#^#$repo #")
      done')

    for repo in $(regctl repo ls "$REGISTRY"); do
      ref="$REGISTRY/$repo"

      sorted=$(echo "$pushed" | awk -v repo="$repo" '$1 == repo {print $2}')

      # buildx の push は index と子 manifest になるため、残すタグの子も消さないように集める
      keep_digests=$(for tag in $(echo "$sorted" | head -n "$KEEP"); do
        regctl image digest "$ref:$tag"
        regctl manifest get "$ref:$tag" --format '{{ if .IsList }}{{ range .GetManifestList }}{{ .Digest }}{{ "\n" }}{{ end }}{{ end }}'
      done)

      # 同じ中身のビルドは子 manifest を共有するため、消した digest を覚えて二重に消さない
      deleted_digests=""
      for tag in $(echo "$sorted" | tail -n "+$((KEEP + 1))"); do
        # 同じ manifest を指す別のタグを先に消していれば、このタグも一緒に消えている
        if ! index=$(regctl image digest "$ref:$tag" 2>/dev/null); then
          echo "already deleted: $repo:$tag"
          continue
        fi
        children=$(regctl manifest get "$ref:$tag" --format '{{ if .IsList }}{{ range .GetManifestList }}{{ .Digest }} {{ end }}{{ end }}')
        for digest in $children $index; do
          if echo "$keep_digests $deleted_digests" | tr ' ' '\n' | grep -qx "$digest"; then
            continue
          fi
          regctl manifest rm "$ref@$digest"
          deleted_digests="$deleted_digests $digest"
        done
        echo "deleted: $repo:$tag"
      done
    done

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-cleanup
spec:
  schedule: "0 4 * * 0"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: registry-cleaner
          restartPolicy: Never
          initContainers:
            # prune-tags は kubectl と regctl の両方を使うため、regctl のバイナリを渡す
            - name: install-regctl
              image: ghcr.io/regclient/regctl:v0.8.3-alpine
              command: ["cp", "/usr/local/bin/regctl", "/tools/regctl"]
              volumeMounts:
                - name: tools
                  mountPath: /tools
            - name: prune-tags
              image: alpine/k8s:1.35.9
              command: ["sh", "/scripts/prune-tags.sh"]
              env:
                - name: PATH
                  value: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: tools
                  mountPath: /tools
            # --delete-untagged は index の子 manifest まで消してイメージを壊すため使わない
            - name: garbage-collect
              image: registry.k8s.io/kubectl:v1.31.14
              args:
                - exec
                - deployment/registry-backend
                - --
                - sh
                - -c
                - |
                  set -o pipefail
                  echo "before: $(du -sh /var/lib/registry | cut -f1)"
                  registry garbage-collect /etc/docker/registry/config.yml | grep -v ': marking '
                  echo "after: $(du -sh /var/lib/registry | cut -f1)"
          containers:
            # GC 後もメモリ上の blob キャッシュが残り、次の push でレイヤーが欠けるため再起動する
            - name: restart-registry
              image: registry.k8s.io/kubectl:v1.31.14
              args:
                - rollout
                - restart
                - deployment/registry-backend
          volumes:
            - name: scripts
              configMap:
                name: registry-cleanup-script
            - name: tools
              emptyDir: {}
