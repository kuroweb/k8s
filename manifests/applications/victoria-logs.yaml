apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-logs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-logs-single
    targetRevision: 0.13.13
    helm:
      values: |
        server:
          fullnameOverride: victoria-logs
          replicaCount: 1
          retentionPeriod: 7d
          retentionDiskSpaceUsage: 14GiB
          persistentVolume:
            enabled: true
            storageClassName: longhorn
            size: 20Gi
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            hosts:
              - name: victoria-logs.kuroweb.net
                path:
                  - /select
                port: http
            tls:
              - secretName: victoria-logs-ingress-cert
                hosts:
                  - victoria-logs.kuroweb.net
        extraObjects:
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: victoria-logs-ingress-cert
              namespace: logging
            spec:
              secretName: victoria-logs-ingress-cert
              issuerRef:
                name: tls-cluster-issuer
                kind: ClusterIssuer
              commonName: victoria-logs.kuroweb.net
              dnsNames:
                - victoria-logs.kuroweb.net
              renewBefore: 720h
              duration: 2160h
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
