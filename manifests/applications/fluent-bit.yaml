apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.58.3
    helm:
      values: |
        fullnameOverride: fluent-bit
        kind: DaemonSet
        testFramework:
          enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        daemonSetVolumes:
          - name: varlog
            hostPath:
              path: /var/log
              type: Directory
          - name: buffer
            hostPath:
              path: /var/lib/fluent-bit
              type: DirectoryOrCreate
        daemonSetVolumeMounts:
          - name: varlog
            mountPath: /var/log
            readOnly: true
          - name: buffer
            mountPath: /buffers
        config:
          service: |
            [SERVICE]
                Daemon Off
                Flush 5
                Log_Level info
                Parsers_File /fluent-bit/etc/parsers.conf
                HTTP_Server On
                HTTP_Listen 0.0.0.0
                HTTP_Port 2020
                Health_Check On
                storage.path /buffers/storage
                storage.sync normal
                storage.checksum On
                storage.backlog.mem_limit 16M
                storage.max_chunks_up 32
          inputs: |
            [INPUT]
                Name tail
                Path /var/log/containers/*_price-monitoring-production_*.log
                Exclude_Path /var/log/containers/backend-db-*_price-monitoring-production_*.log,/var/log/containers/backend-redis-*_price-monitoring-production_*.log,/var/log/containers/auth-provider-db-*_price-monitoring-production_*.log,/var/log/containers/auth-provider-redis-*_price-monitoring-production_*.log
                Tag kube.*
                multiline.parser cri
                DB /buffers/tail.db
                DB.Sync Normal
                Read_From_Head Off
                Refresh_Interval 5
                Rotate_Wait 30
                Buffer_Max_Size 256K
                Skip_Long_Lines On
                storage.type filesystem
          filters: |
            [FILTER]
                Name kubernetes
                Match kube.*
                Kube_Tag_Prefix kube.var.log.containers.
                Merge_Log Off
                Labels On
                Annotations Off
            [FILTER]
                Name nest
                Match kube.*
                Operation lift
                Nested_under kubernetes
                Add_prefix k8s_
            [FILTER]
                Name modify
                Match kube.*
                Add env production
                Add cluster homelab
          outputs: |
            [OUTPUT]
                Name http
                Match kube.*
                Host victoria-logs.logging.svc.cluster.local
                Port 9428
                URI /insert/jsonline?_stream_fields=cluster,env,k8s_namespace_name,k8s_container_name,stream&_msg_field=log&_time_field=date
                Format json_lines
                Json_Date_Key date
                Json_Date_Format iso8601
                Retry_Limit False
                storage.total_limit_size 1G
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
