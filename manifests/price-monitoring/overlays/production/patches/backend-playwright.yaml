apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-playwright-deployment
spec:
  replicas: 15
  template:
    spec:
      containers:
        - name: backend-playwright
          resources:
            requests:
              cpu: "700m"
              memory: "768Mi"
            limits:
              cpu: "700m"
              memory: "1200Mi"
