apiVersion: v1
kind: Service
metadata:
  name: auth-provider-db-service
spec:
  loadBalancerIP: 10.15.100.235
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-provider-db-deployment
spec:
  template:
    spec:
      containers:
        - name: auth-provider-db
          resources:
            limits:
              cpu: "300m"
              memory: "500Mi"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-provider-db-storage
spec:
  volumeName: pvc-3450b3be-5fb1-43a0-b909-0f77f195ef35
