apiVersion: v1
kind: Service
metadata:
  name: auth-provider-db-service
spec:
  selector:
    app: auth-provider
    server: auth-provider-db
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 3306
      targetPort: 3306
  loadBalancerIP: 10.15.100.231

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-provider-db-deployment
  labels:
    app: auth-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-provider
      server: auth-provider-db
  template:
    metadata:
      labels:
        app: auth-provider
        server: auth-provider-db
    spec:
      containers:
        - name: auth-provider-db
          image: mysql/mysql-server:8.0
          ports:
            - name: http
              containerPort: 3306
          resources:
            limits:
              cpu: "500m"
              memory: "1000Mi"
          volumeMounts:
            - name: auth-provider-db-storage
              mountPath: /var/lib/mysql
          env:
            - name: MYSQL_ROOT_HOST
              value: "%"
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "yes"
      volumes:
        - name: auth-provider-db-storage
          persistentVolumeClaim:
            claimName: auth-provider-db-storage

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-provider-db-storage
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
