apiVersion: v1
kind: Service
metadata:
  name: auth-provider-redis-service
spec:
  selector:
    app: auth-provider
    server: auth-provider-redis
  type: LoadBalancer
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-provider-redis-deployment
  labels:
    app: auth-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-provider
      server: auth-provider-redis
  template:
    metadata:
      labels:
        app: auth-provider
        server: auth-provider-redis
    spec:
      initContainers:
        - name: repair-redis
          image: redis
          command:
            [
              "sh",
              "-c",
              "if [ -f /data/appendonlydir/appendonly.aof.manifest ]; then echo 'y' | redis-check-aof --fix /data/appendonlydir/appendonly.aof.manifest; fi",
            ]
          volumeMounts:
            - name: auth-provider-redis-storage
              mountPath: /data
      containers:
        - name: auth-provider-redis
          image: redis
          args: ["--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            limits:
              cpu: "300m"
              memory: "500Mi"
          volumeMounts:
            - name: auth-provider-redis-storage
              mountPath: /data
          env:
            - name: ALLOW_EMPTY_PASSWORD
              value: "yes"
      volumes:
        - name: auth-provider-redis-storage
          persistentVolumeClaim:
            claimName: auth-provider-redis-storage
      securityContext:
        fsGroup: 999

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-provider-redis-storage
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
